version: '3.8'

services:
  # Database: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: sdde-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sdde
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdde"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object Storage: MinIO
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: sdde-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker: RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sdde-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mail Testing Tool: Mailpit
  mailpit:
    image: axllent/mailpit:v1.15
    container_name: sdde-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
