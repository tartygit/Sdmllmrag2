name: SDDE CI/CD Verification Pipeline

on:
  push:
    branches: [ main, "jules-*" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Spring Boot Backend Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Resolve Maven Dependencies & Compile
        run: mvn -f backend/pom.xml clean compile

      - name: Run Backend JUnit Test Suite
        run: mvn -f backend/pom.xml test

  frontend-validation:
    name: React Frontend Build & Lint Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend NPM Dependencies
        run: |
          cd frontend
          npm install

      - name: Execute Front-end Production Build
        run: |
          cd frontend
          npm run build
