spring:
  application:
    name: ${APP_NAME:Software Development Document Environment}
    code: ${APP_CODE:SDDE}
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sdde}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI/Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

# Application Custom Properties
app:
  storage:
    type: ${STORAGE_TYPE:local} # local, s3, minio
    local-path: ${STORAGE_LOCAL_PATH:/var/data/sdde}
    s3:
      bucket-name: ${STORAGE_S3_BUCKET:sdde-documents}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      region: ${STORAGE_S3_REGION:us-east-1}
      endpoint-url: ${STORAGE_S3_ENDPOINT:}
  features:
    enable-workflow-notifications: ${FEATURE_WORKFLOW_NOTIFICATIONS:true}
    enable-auto-archive: ${FEATURE_AUTO_ARCHIVE:false}
    require-multi-approval: ${FEATURE_MULTI_APPROVAL:true}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/sdde_dev
    username: postgres
    password: postgres

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${POSTGRES_DB_URL:jdbc:postgresql://localhost:5432/sdde}
    username: ${POSTGRES_DB_USERNAME:postgres}
    password: ${POSTGRES_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@localhost:1521:ORCL}
    username: ${ORACLE_DB_USERNAME:system}
    password: ${ORACLE_DB_PASSWORD:oracle}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect

---
spring:
  config:
    activate:
      on-profile: sqlserver
  datasource:
    url: ${SQLSERVER_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=sdde;encrypt=true;trustServerCertificate=true}
    username: ${SQLSERVER_DB_USERNAME:sa}
    password: ${SQLSERVER_DB_PASSWORD:Password123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
