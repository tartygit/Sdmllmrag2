              - column: { name: description, value: "User password expiry configuration in days" }
        - insert:
            tableName: system_configurations
            columns:
              - column: { name: config_key, value: user.lockout.attempts }
              - column: { name: config_value, value: "5" }
              - column: { name: description, value: "Max login retry attempts before lockout" }

        - insert:
            tableName: users
            columns:
              - column: { name: id, value: 1 }
              - column: { name: username, value: admin }
              - column: { name: password, value: "$2a$10$8.K7XWcAtb3N3j0xZ6wKcewR2l0O.qf1h5l9kFMyyBfE5W0P4n38y" }
              - column: { name: email, value: admin@cth.com }
              - column: { name: enabled, value: true }
              - column: { name: locked, value: false }
              - column: { name: login_attempts, value: 0 }
        - insert:
            tableName: users
            columns:
              - column: { name: id, value: 2 }
              - column: { name: username, value: maker }
              - column: { name: password, value: "$2a$10$8.K7XWcAtb3N3j0xZ6wKcewR2l0O.qf1h5l9kFMyyBfE5W0P4n38y" }
              - column: { name: email, value: maker@cth.com }
              - column: { name: enabled, value: true }
              - column: { name: locked, value: false }
              - column: { name: login_attempts, value: 0 }
        - insert:
            tableName: users
            columns:
              - column: { name: id, value: 3 }
              - column: { name: username, value: checker }
              - column: { name: password, value: "$2a$10$8.K7XWcAtb3N3j0xZ6wKcewR2l0O.qf1h5l9kFMyyBfE5W0P4n38y" }
              - column: { name: email, value: checker@cth.com }
              - column: { name: enabled, value: true }
              - column: { name: locked, value: false }
              - column: { name: login_attempts, value: 0 }
        - insert:
            tableName: users
            columns:
              - column: { name: id, value: 4 }
              - column: { name: username, value: approver }
              - column: { name: password, value: "$2a$10$8.K7XWcAtb3N3j0xZ6wKcewR2l0O.qf1h5l9kFMyyBfE5W0P4n38y" }
              - column: { name: email, value: approver@cth.com }
              - column: { name: enabled, value: true }
              - column: { name: locked, value: false }
              - column: { name: login_attempts, value: 0 }

        - insert:
            tableName: user_roles
            columns:
              - column: { name: user_id, value: 1 }
              - column: { name: role_id, value: 1 }
        - insert:
            tableName: user_roles
            columns:
